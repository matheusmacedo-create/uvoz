name: App Windows (instalador)

# Gera o instalador UVoz-Setup-<versão>.exe.
# - A cada mudança em desktop/ (ou manualmente em Actions → Run workflow): o .exe fica em "Artifacts" da execução.
# - Ao criar uma tag desktop-v<versão> (ex.: desktop-v1.0.0): o .exe é anexado a uma Release.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/quirky-mccarthy-8qfrk9]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # sem certificado de assinatura por enquanto
      - uses: actions/upload-artifact@v4
        with:
          name: UVoz-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Anexar à Release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
